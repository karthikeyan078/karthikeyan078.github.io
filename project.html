<style>

/* =========================================================
   ROOT
========================================================= */

:root{
    --black:#070707;
    --surface:#111214;
    --surface-2:#17181b;
    --white:#f3f3f3;
    --muted:#8d8f93;
    --line:rgba(255,255,255,.12);
    --soft-line:rgba(255,255,255,.08);

    --font-display:'Manrope',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:var(--black);
    color:var(--white);
    font-family:var(--font-display);
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:300px;

    position:relative;
    overflow:hidden;

    border-bottom:1px solid var(--line);

    padding:30px;

    display:flex;
    align-items:flex-end;
}


.hero:before{
    content:"";

    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 8% 30%,
            rgba(0,0,0,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 60% 0%,
            rgba(0,0,0,.3),
            transparent 32%
        ),
        linear-gradient(
            110deg,
            #07101a,
            #080b10 50%,
            #10080d
        );
}


.hero:after{
    content:"";

    position:absolute;
    inset:0;

    opacity:.25;

    background:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:44px 44px;
}


.hero-inner{
    position:relative;
    z-index:2;

    width:min(1180px,100%);

    margin:auto;
}


/* =========================================================
   BACK
========================================================= */

.back{
    display:inline-block;

    margin-bottom:20px;

    color:#92959a;

    font-family:var(--font-mono);

    font-size:9px;

    font-weight:600;

    letter-spacing:.04em;

    text-transform:uppercase;
}

.back:hover{
    color:#fff;
}


/* =========================================================
   HERO STATUS
========================================================= */

.status-label{
    margin-bottom:5px;

    color:#d7d7d7;

    font-family:var(--font-mono);

    font-size:9px;

    font-weight:700;

    letter-spacing:.09em;

    text-transform:uppercase;
}


/* =========================================================
   HERO TITLE
========================================================= */

.hero h1{
    font-size:clamp(42px,7vw,72px);

    line-height:.94;

    letter-spacing:-.055em;

    margin-bottom:14px;
}


/* =========================================================
   HERO SUMMARY
========================================================= */

.hero p{
    max-width:1000px;

    color:#a2a4a8;

    font-family:var(--font-mono);

    font-size:9px;

    line-height:1.7;

    letter-spacing:.035em;

    text-transform:uppercase;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    width:min(1180px,calc(100% - 60px));

    margin:auto;

    padding:34px 0 100px;
}


/* =========================================================
   PROJECT NAVIGATION
========================================================= */

.project-nav{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:34px;
}

.project-nav button{
    border:1px solid var(--line);

    background:transparent;

    color:#898b8f;

    border-radius:999px;

    padding:8px 13px;

    cursor:pointer;

    font-family:var(--font-mono);

    font-size:9px;

    transition:.25s;
}

.project-nav button:hover,
.project-nav button.active{
    color:#fff;

    border-color:rgba(255,255,255,.55);

    background:#151619;
}


/* =========================================================
   MAIN LAYOUT
========================================================= */

.layout{
    display:grid;

    grid-template-columns:minmax(0,1fr) 300px;

    gap:32px;

    align-items:start;
}

.content{
    min-width:0;
}


/* =========================================================
   LEAD
========================================================= */

.lead{
    max-width:760px;

    padding-bottom:30px;

    border-bottom:1px solid var(--line);

    color:#eee;

    font-size:15px;

    line-height:1.75;

    font-weight:600;
}


/* =========================================================
   PROJECT SECTIONS
========================================================= */

.project-block{
    margin-top:36px;
}

.section-title{
    margin:0 0 14px;

    font-size:18px;

    line-height:1.2;

    letter-spacing:-.02em;
}

.rule{
    height:1px;

    background:var(--line);

    margin-bottom:22px;
}


/* =========================================================
   NORMAL TEXT
========================================================= */

.body-text{
    max-width:760px;

    color:#bfc1c5;

    font-size:14px;

    line-height:1.85;

    margin-bottom:14px;
}


/* =========================================================
   LISTS
========================================================= */

.content-list{
    max-width:760px;

    margin:0 0 10px 20px;

    color:#bfc1c5;

    display:flex;

    flex-direction:column;

    gap:12px;
}

.content-list li{
    padding-left:4px;

    font-size:14px;

    line-height:1.75;
}

.content-list.ordered{
    list-style:decimal;
}


/* =========================
   MEDIA GALLERY — OLD STYLE
========================= */

.gallery-track {
    display: flex;
    flex-wrap: nowrap;
    gap: 12px;

    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    padding-bottom: 10px;

    scrollbar-width: thin;
    scrollbar-color: #47494d transparent;
}

.gallery-track::-webkit-scrollbar {
    height: 7px;
}

.gallery-track::-webkit-scrollbar-track {
    background: transparent;
}

.gallery-track::-webkit-scrollbar-thumb {
    background: #47494d;
    border-radius: 99px;
}


/* FIXED CARD SIZE */

.gallery-card {
    position: relative;

    flex: 0 0 255px;
    width: 255px;
    height: 250px;

    overflow: hidden;

    border: 1px solid var(--soft-line);
    border-radius: 8px;

    background: #111214;
}


/* IMAGE */

.gallery-card img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    opacity: .9;

    transition:
        transform .35s ease,
        opacity .35s ease;
}


/* DARK GRADIENT FOR CAPTION */

.gallery-card::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 80px;

    background: linear-gradient(
        transparent,
        rgba(0,0,0,.85)
    );

    pointer-events: none;
}


/* CAPTION */

.gallery-caption {
    position: absolute;

    z-index: 3;

    left: 12px;
    right: 12px;
    bottom: 11px;

    color: #d2d2d2;

    font-family: var(--font-mono);
    font-size: 8px;

    text-transform: uppercase;
    letter-spacing: .05em;
}


/* HOVER */

.gallery-card:hover img {
    transform: scale(1.04);
    opacity: 1;
}
/* =========================================================
   SIDEBAR
========================================================= */

.info-card{
    position:sticky;

    top:24px;

    padding:16px;

    border:1px solid var(--line);

    border-radius:13px;

    background:var(--surface-2);
}


/* =========================================================
   HAVE A LOOK LINK
========================================================= */

.look-link{
    display:flex;

    align-items:center;

    justify-content:space-between;

    width:100%;

    padding:11px 12px;

    border:1px solid rgba(255,255,255,.16);

    border-radius:7px;

    background:#101114;

    color:#e8e8e8;

    font-family:var(--font-mono);

    font-size:9px;

    font-weight:600;

    letter-spacing:.04em;

    text-transform:uppercase;

    transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        transform .2s ease;
}

.look-link:hover{
    background:#202125;

    border-color:rgba(255,255,255,.45);

    color:#fff;

    transform:translateY(-1px);
}

.look-arrow{
    font-size:12px;

    opacity:.7;
}


/* =========================================================
   SIDEBAR INFORMATION
========================================================= */

.info-group{
    margin-top:22px;
}

.info-card > .info-group:first-child{
    margin-top:0;
}

.label{
    margin-bottom:7px;

    color:#6f7175;

    font-family:var(--font-mono);

    font-size:8px;

    letter-spacing:.09em;

    text-transform:uppercase;
}

.value{
    color:#eee;

    font-size:11px;

    line-height:1.5;
}


/* =========================================================
   TECHNOLOGY TAGS
========================================================= */

.tags{
    display:flex;

    flex-wrap:wrap;

    gap:5px;
}

.tag{
    padding:4px 6px;

    border:1px solid rgba(255,255,255,.09);

    border-radius:3px;

    background:#101114;

    color:#aaa;

    font-family:var(--font-mono);

    font-size:7px;

    text-transform:uppercase;
}


/* =========================================================
   STATUS
========================================================= */

.status{
    font-size:10px;

    font-weight:600;
}


/* =========================================================
   PROJECT SWITCHING
========================================================= */

.project-section{
    display:none;
}

.project-section.active{
    display:block;
}


/* =========================================================
   PREVIOUS / NEXT
========================================================= */

.next{
    display:flex;

    justify-content:space-between;

    gap:20px;

    margin-top:45px;

    padding-top:20px;

    border-top:1px solid var(--line);
}

.next button{
    border:0;

    background:none;

    color:#aaa;

    cursor:pointer;

    font-family:var(--font-mono);

    font-size:9px;
}

.next button:hover{
    color:#fff;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .info-card{
        position:static;

        order:-1;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .hero{
        min-height:260px;

        padding:25px 20px;
    }

    .page{
        width:calc(100% - 36px);

        padding-top:24px;
    }

    .gallery-card{
        flex-basis:225px;

        height:280px;
    }

    .lead{
        font-size:14px;
    }

    .body-text,
    .content-list li{
        font-size:13px;
    }

    .next{
        flex-direction:column;
    }

    .look-link{
        padding:12px;
    }

    /* Readable text + bigger tap targets on phones */

    .back{
        font-size:11px;
        padding:6px 0;
    }

    .status-label{
        font-size:10px;
    }

    .hero h1{
        font-size:clamp(34px,11vw,56px);
    }

    .hero p{
        font-size:11px;
    }

    .project-nav button{
        font-size:11px;
        padding:9px 14px;
    }

    .section-title{
        font-size:17px;
    }

    .gallery-track{
        scroll-snap-type:x mandatory;
    }

    .gallery-card{
        flex:0 0 78vw;
        width:78vw;
        height:auto;
        aspect-ratio:4/3;
        scroll-snap-align:start;
    }

    .gallery-caption{
        font-size:10px;
    }

    .look-link{
        font-size:11px;
    }

    .label{
        font-size:10px;
    }

    .value{
        font-size:13px;
    }

    .tag{
        font-size:10px;
        padding:5px 8px;
    }

    .status{
        font-size:12px;
    }

    .next button{
        font-size:11px;
        padding:8px 0;
        text-align:left;
    }
}

</style>
</head>

/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
    new URLSearchParams(location.search);

let activeId =
    params.get("project") || "unseen";


/* =========================================================
   DOM ELEMENTS
========================================================= */

const nav =
    document.getElementById("projectNav");

const container =
    document.getElementById("projectContainer");


/* =========================================================
   CREATE PROJECT
========================================================= */

function makeProject(project){

    const section =
        document.createElement("section");

    section.className =
        "project-section";

    section.id =
        project.id;


    section.innerHTML = `

        <div class="layout">


            <!-- =========================================
                 MAIN CONTENT
            ========================================== -->

            <div class="content">


                <!-- LEAD -->

                <p class="lead">
                    ${project.lead}
                </p>


                <!-- =====================================
                     MEDIA GALLERY
                ====================================== -->

                <div class="project-block">

                    <h2 class="section-title">
                        Media Gallery
                    </h2>

                    <div class="rule"></div>


                                            <div class="gallery-track">

                                ${project.gallery.map(
                                    (item,index)=>`

                                    <div class="gallery-card">

                                        <img
                                            src="${item[0]}"
                                            alt="${item[1]}"
                                            loading="lazy"
                                        >

                                        <div class="gallery-caption">
                                            ${String(index+1).padStart(2,"0")}
                                            —
                                            ${item[1]}
                                        </div>

                                    </div>

                                `).join("")}

                            </div>

                </div>


                <!-- =====================================
                     THE CHALLENGE
                ====================================== -->

                <div class="project-block">

                    <h2 class="section-title">
                        The Challenge
                    </h2>

                    <div class="rule"></div>


                    <ul class="content-list">

                        ${project.challenge.map(
                            item=>`

                            <li>
                                ${item}
                            </li>

                        `).join("")}

                    </ul>

                </div>


                <!-- =====================================
                     TECHNICAL SOLUTIONS
                ====================================== -->

                <div class="project-block">

                    <h2 class="section-title">
                        Technical Solutions
                    </h2>

                    <div class="rule"></div>


                    ${project.solutions.map(
                        item=>`

                        <p class="body-text">
                            ${item}
                        </p>

                    `).join("")}

                </div>


                <!-- =====================================
                     DEVELOPMENT PROCESS
                ====================================== -->

                <div class="project-block">

                    <h2 class="section-title">
                        Development Process
                    </h2>

                    <div class="rule"></div>


                    <ol class="content-list ordered">

                        ${project.process.map(
                            item=>`

                            <li>
                                ${item}
                            </li>

                        `).join("")}

                    </ol>

                </div>


            </div>


            <!-- =========================================
                 SIDEBAR
            ========================================== -->

            <aside class="info-card">


                <!-- =====================================
                     HAVE A LOOK
                ====================================== -->

                ${project.lookLink ? `
                <a
                    href="${project.lookLink}"
                    class="look-link"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <span>
                        Have a look
                    </span>

                    <span class="look-arrow">
                        ↗
                    </span>

                </a>` : ""}


                <!-- =====================================
                     ROLE
                ====================================== -->

                <div class="info-group">

                    <div class="label">
                        Role
                    </div>

                    <div class="value">
                        ${project.role}
                    </div>

                </div>


                <!-- =====================================
                     TECHNOLOGIES
                ====================================== -->

                <div class="info-group">

                    <div class="label">
                        Technologies
                    </div>


                    <div class="tags">

                        ${project.technologies.map(
                            tech=>`

                            <span class="tag">
                                ${tech}
                            </span>

                        `).join("")}

                    </div>

                </div>


                <!-- =====================================
                     STATUS
                ====================================== -->

                <div class="info-group">

                    <div class="label">
                        Status
                    </div>

                    <div class="status">
                        ${project.status}
                    </div>

                </div>


                <!-- =====================================
                     PROJECT TYPE
                ====================================== -->

                <div class="info-group">

                    <div class="label">
                        Project Type
                    </div>

                    <div class="value">
                        ${project.type}
                    </div>

                </div>


            </aside>


        </div>


        <!-- =============================================
             PREVIOUS / NEXT
        ============================================== -->

        <div class="next">

            <button
                onclick="previousProject()"
            >
                ← Previous Project
            </button>


            <button
                onclick="nextProject()"
            >
                Next Project →
            </button>

        </div>

    `;


    container.appendChild(section);
}


/* =========================================================
   CREATE ALL PROJECTS
========================================================= */

projects.forEach(
    makeProject
);


/* =========================================================
   CREATE PROJECT NAVIGATION
========================================================= */

projects.forEach(project=>{

    const button =
        document.createElement("button");


    button.textContent =
        project.title;


    button.dataset.id =
        project.id;


    button.addEventListener(
        "click",
        ()=>{
            showProject(project.id);
        }
    );


    nav.appendChild(button);

});


/* =========================================================
   SHOW PROJECT
========================================================= */

function showProject(
    id,
    updateUrl=true
){

    const project =
        projects.find(
            p=>p.id===id
        ) || projects[0];


    activeId =
        project.id;


    /* SHOW ACTIVE PROJECT */

    document
        .querySelectorAll(".project-section")
        .forEach(section=>{

            section.classList.toggle(
                "active",
                section.id===activeId
            );

        });


    /* ACTIVE NAV BUTTON */

    document
        .querySelectorAll(".project-nav button")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.id===activeId
            );

        });


    /* HERO STATUS */

    document.getElementById(
        "heroStatus"
    ).textContent =
        project.status;


    /* HERO TITLE */

    document.getElementById(
        "heroTitle"
    ).textContent =
        project.title;


    /* HERO SUMMARY */

    document.getElementById(
        "heroSummary"
    ).textContent =
        project.summary;


    /* PAGE TITLE */

    document.title =
        `${project.title} – ${project.type} | Karthi, Game Developer`;

    document.getElementById("metaDescription").content =
        project.summary;

    document.getElementById("canonicalLink").href =
        `https://karthikeyan078.github.io/DevPortfolio/project.html?project=${project.id}`;


    /* UPDATE URL */

    if(updateUrl){

        history.replaceState(
            null,
            "",
            `project.html?project=${project.id}`
        );

    }


    /* SCROLL TO TOP */

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   PREVIOUS PROJECT
========================================================= */

function previousProject(){

    const index =
        projects.findIndex(
            p=>p.id===activeId
        );


    const nextIndex =
        (index - 1 + projects.length)
        % projects.length;


    showProject(
        projects[nextIndex].id
    );

}


/* =========================================================
   NEXT PROJECT
========================================================= */

function nextProject(){

    const index =
        projects.findIndex(
            p=>p.id===activeId
        );


    const nextIndex =
        (index + 1)
        % projects.length;


    showProject(
        projects[nextIndex].id
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

showProject(
    activeId,
    false
);

</script>
